name: Release

on:
  push:
    tags:
      - "v*"

# tauri-action creates a GitHub Release (draft) and uploads artifacts,
# which requires write access to contents. The default GITHUB_TOKEN is
# otherwise read-only and the release step fails with
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential curl wget file libxdo-dev libssl-dev

      - name: Install frontend dependencies
        run: cd apps/desktop && npm ci

      - name: Fetch whisper.cpp + ffmpeg sidecar binaries (ADR-0007)
        shell: bash
        run: .github/scripts/fetch-sidecars.sh ${{ matrix.target }}

      # 运行时注入 externalBin（dev 不需要，避免本地构建报缺二进制）。
      # 经 tauri build --config <文件> 传入——实测 TAURI_CONFIG 环境变量在
      # npm run tauri:build 链路上不生效（安装包内无 sidecar），--config 可靠。
      # resources：whisper 伴生动态库（Win: whisper.dll/ggml*.dll；Linux: lib*.so*）
      # 平铺到资源目录根（Windows NSIS 下 = 主程序/sidecar 同目录，DLL 搜索才能命中；
      # map+glob 语义 = 只保留文件名）。glob 无匹配会报错，故按 OS 分文件。
      - name: Select sidecar bundle config (per-OS)
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            echo "TAURI_ARGS=--config ${{ github.workspace }}/apps/desktop/src-tauri/sidecar-win.json" >> "$GITHUB_ENV"
          else
            echo "TAURI_ARGS=--config ${{ github.workspace }}/apps/desktop/src-tauri/sidecar-linux.json" >> "$GITHUB_ENV"
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ env.TAURI_ARGS }}
          tagName: ${{ github.ref_name }}
          releaseName: "LMNotes ${{ github.ref_name }}"
          releaseBody: "LMNotes v0.1 — Local-first, LLM-native note app with OKF compliance."
          releaseDraft: true
          prerelease: false
