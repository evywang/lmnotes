name: Release

on:
  push:
    tags:
      - "v*"

# tauri-action creates a GitHub Release (draft) and uploads artifacts,
# which requires write access to contents. The default GITHUB_TOKEN is
# otherwise read-only and the release step fails with
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential curl wget file libxdo-dev libssl-dev

      - name: Install frontend dependencies
        run: cd apps/desktop && npm ci

      - name: Fetch whisper.cpp + ffmpeg sidecar binaries (ADR-0007)
        shell: bash
        run: .github/scripts/fetch-sidecars.sh ${{ matrix.target }}

      # 运行时注入 externalBin（dev 不需要，避免本地构建报缺二进制）。
      # resources：whisper 的伴生动态库落到资源目录（Windows NSIS 下与主程序/sidecar
      # 同目录，DLL 搜索路径才能命中；map+glob 语义 = 只保留文件名）。
      # 注意：glob 在目标平台无匹配会报 GlobPathNotFound，故按 OS 分别构造。
      - name: Build TAURI_CONFIG (per-OS sidecar injection)
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            echo 'TAURI_CONFIG={"bundle":{"externalBin":["binaries/whisper","binaries/ffmpeg"],"resources":{"binaries/*.dll":"./"}}}' >> "$GITHUB_ENV"
          else
            echo 'TAURI_CONFIG={"bundle":{"externalBin":["binaries/whisper","binaries/ffmpeg"],"resources":{"binaries/*.so*":"./"}}}' >> "$GITHUB_ENV"
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "LMNotes ${{ github.ref_name }}"
          releaseBody: "LMNotes v0.1 — Local-first, LLM-native note app with OKF compliance."
          releaseDraft: true
          prerelease: false
