name: Release

on:
  push:
    tags:
      - "v*"

# tauri-action creates a GitHub Release (draft) and uploads artifacts,
# which requires write access to contents. The default GITHUB_TOKEN is
# otherwise read-only and the release step fails with
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential curl wget file libxdo-dev libssl-dev
          # libfuse2：linuxdeploy 运行 AppImage 工具的运行时依赖（v0.6.0 实测缺失导致
          # "failed to run linuxdeploy"）；desktop-file-utils/patchelf：linuxdeploy
          # 及 AppImage 工具链的常见缺包（社区线程反复出现的第二层根因）
          sudo apt-get install -y libfuse2 desktop-file-utils patchelf

      - name: Install frontend dependencies
        run: cd apps/desktop && npm ci

      - name: Install sidecar build tools (macOS source builds)
        if: runner.os == 'macOS'
        # libomp：whisper.cpp 源码构建的 OpenMP 依赖（v0.6.0 实测 "OpenMP not found"
        # 导致 cmake 阶段 exit 2）
        run: brew install cmake libomp

      # gh（fetch-sidecars.sh 内部用）在 Actions 里必须显式传 token，
      # 否则 `gh release view/download` 以 exit 4 失败（Windows 实测）。
      - name: Fetch/build whisper.cpp + ffmpeg sidecar binaries (ADR-0007)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ matrix.target }}" == *darwin* ]]; then
            .github/scripts/build-sidecars-macos.sh ${{ matrix.target }}
          else
            .github/scripts/fetch-sidecars.sh ${{ matrix.target }}
          fi

      # externalBin 与 resources 已由 tauri.{windows,linux,macos}.conf.json 声明，
      # Tauri 2 按当前平台自动加载（b0878c9 起）——无需再经 --config 注入；
      # 旧的 sidecar-*.json 选择步骤引用的文件已随该提交改名删除。

      # 可选签名/公证（ADR-0007/设计）：无 Apple Secrets 时跳过（产物为未签名 dmg）。
      - name: Codesign & notarize (optional)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Signing handled by tauri-action via APPLE_* env (tauri.conf signingIdentity)."
          # tauri-action 检测到 APPLE_CERTIFICATE/APPLE_ID 等环境变量时自动 codesign+notarytool

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AppImage 工具（linuxdeploy）免 FUSE 运行——libfuse2 已装仍失败的
          # 兜底（v0.7.0 实测：deb/rpm 成功、仅 AppImage 挂 linuxdeploy）。
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy 第二个已知坑：strip 阶段权限错误同样报
          # "failed to run linuxdeploy"，NO_STRIP 跳过 strip。
          NO_STRIP: "true"
          # 真凶（--verbose 实测）：linuxdeploy 扫描 AppDir 内 sidecar ELF 时
          # 按 ldd 解析动态依赖，Ubuntu 预编译 whisper 链 libwhisper.so.1/
          # libggml*.so（伴生库在 binaries/）——系统目录找不到即报
          # "Could not find dependency"。LD_LIBRARY_PATH 指向 binaries/ 让
          # 解析成功并把伴生库正常部署进 AppImage。
          LD_LIBRARY_PATH: ${{ github.workspace }}/apps/desktop/src-tauri/binaries
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "LMNotes ${{ github.ref_name }}"
          releaseBody: "Bilingual release notes: docs/release-notes/ in the repository. Highlights in the tag announcement."
          releaseDraft: true
          prerelease: false
